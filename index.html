<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"

      content="一只灰色蓬松毛绒小怪兽会用红色大眼睛平滑追踪鼠标或手指。"
    />
    <title>毛绒小怪兽的互动凝视</title>
    <link rel="preload" href="assets/fur-texture.svg" as="image" type="image/svg+xml" />

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="stage">

      <div class="ambient ambient--moon" aria-hidden="true"></div>
      <div class="ambient ambient--blush" aria-hidden="true"></div>
      <section class="hero" aria-labelledby="page-title">
        <div class="copy">
          <p class="eyebrow">Soft Gaze Companion</p>
          <h1 id="page-title">遇见会看着你的灰灰毛绒兽</h1>
          <p class="intro">
            移动鼠标，或在手机上轻触拖动。它的大眼睛会用自然缓动追随你，红色虹膜始终被安全限制在眼球里。
          </p>
        </div>

        <div class="plush-card" aria-label="灰色蓬松毛绒生物，红色大眼睛会跟随鼠标或触摸位置移动">
          <div class="fur-halo" aria-hidden="true"></div>
          <div class="creature">
            <span class="tuft tuft--center" aria-hidden="true"></span>
            <span class="tuft tuft--left" aria-hidden="true"></span>
            <span class="tuft tuft--right" aria-hidden="true"></span>
            <span class="ear ear--left" aria-hidden="true"></span>
            <span class="ear ear--right" aria-hidden="true"></span>
            <span class="paw paw--left" aria-hidden="true"></span>
            <span class="paw paw--right" aria-hidden="true"></span>

            <div class="face">
              <div class="eyes" aria-hidden="true">
                <div class="eye" data-eye>
                  <span class="iris"></span>
                  <span class="pupil"></span>
                  <span class="shine shine--large"></span>
                  <span class="shine shine--small"></span>
                </div>
                <div class="eye" data-eye>
                  <span class="iris"></span>
                  <span class="pupil"></span>
                  <span class="shine shine--large"></span>
                  <span class="shine shine--small"></span>
                </div>
              </div>
              <div class="mouth" aria-hidden="true"><span></span></div>
            </div>
          </div>
        </div>

        <p class="hint" id="hint">让光标靠近它，看看它悄悄望向哪里。</p>

      </section>
    </main>
    <script src="script.js" defer></script>
  </body>
</html>
